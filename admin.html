<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SayurBest</title>
    <!-- Tailwind CSS & FontAwesome CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10">

    <!-- Modal Lock Screen Password / PIN Admin -->
    <div id="admin-lock-screen" class="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl max-w-xs w-full text-center space-y-4 shadow-2xl">
            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fas fa-lock"></i>
            </div>
            <div>
                <h3 class="font-bold text-gray-800 text-base">Akses Admin SayurBest</h3>
                <p class="text-xs text-gray-500 mt-1">Masukkan PIN Keamanan untuk mengelola toko.</p>
            </div>
            <div>
                <input type="password" id="pin-input" maxlength="6" placeholder="******" class="w-full border border-gray-300 rounded-xl p-3 text-center text-xl font-bold tracking-widest focus:outline-none focus:border-emerald-600">
                <p id="pin-error" class="text-[11px] text-red-500 font-semibold mt-1.5 hidden">PIN Admin Salah!</p>
            </div>
            <button type="button" onclick="checkAdminPin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">
                Masuk Panel Admin
            </button>
        </div>
    </div>

    <!-- Header Admin -->
    <header class="bg-emerald-700 text-white p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2">
                <i class="fas fa-user-shield"></i> CMS Admin SayurBest
            </h1>
            <a href="index.html" target="_blank" class="bg-emerald-800 hover:bg-emerald-900 text-xs px-3 py-1.5 rounded-lg transition border border-emerald-500">
                <i class="fas fa-external-link-alt mr-1"></i> Buka Toko
            </a>
        </div>
    </header>

    <div class="max-w-xl mx-auto p-4 space-y-6">

        <!-- Form Tambah / Edit Produk -->
        <section class="bg-white rounded-xl p-4 border shadow-sm">
            <h2 id="form-title" class="font-bold text-gray-800 text-sm mb-3 flex items-center gap-2 border-b pb-2">
                <i class="fas fa-plus-circle text-emerald-600"></i> Tambah Produk Baru
            </h2>

            <form id="product-form" class="space-y-3 text-xs">
                <input type="hidden" id="prod-id">

                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Nama Produk</label>
                    <input type="text" id="prod-name" placeholder="Contoh: Bawang Merah Segar" required class="w-full border rounded-lg p-2.5 focus:border-emerald-600 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">Harga Dasar (Rp)</label>
                        <input type="number" id="prod-price" placeholder="8500" required class="w-full border rounded-lg p-2.5 focus:border-emerald-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">Satuan Dasar</label>
                        <input type="text" id="prod-unit" placeholder="100 gram / pack" required class="w-full border rounded-lg p-2.5 focus:border-emerald-600 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">Kategori</label>
                        <select id="prod-category" class="w-full border rounded-lg p-2.5 bg-white focus:border-emerald-600 focus:outline-none">
                            <option value="Sayuran">Sayuran</option>
                            <option value="Ayam & Bebek">Ayam & Bebek</option>
                            <option value="Ikan & Seafood">Ikan & Seafood</option>
                            <option value="Daging Sapi">Daging Sapi</option>
                            <option value="Tahu, Tempe & Oncom">Tahu, Tempe & Oncom</option>
                            <option value="Ikan Asin & Pindang">Ikan Asin & Pindang</option>
                            <option value="Bumbu & Bahan Masak">Bumbu & Bahan Masak</option>
                            <option value="Lauk Siap Masak & Frozen Food">Lauk Siap Masak & Frozen Food</option>
                            <option value="Lauk Matang">Lauk Matang</option>
                            <option value="Buah">Buah</option>
                            <option value="Beras, Telur, Minyak & Bahan Kue">Beras, Telur, Minyak & Bahan Kue</option>
                            <option value="Mie, Bihun, Soun & Kwetiau">Mie, Bihun, Soun & Kwetiau</option>
                            <option value="Kerupuk, Kulit Pangsit & Kulit Lumpia">Kerupuk, Kulit Pangsit & Kulit Lumpia</option>
                            <option value="Teh, Kopi & Air Mineral">Teh, Kopi & Air Mineral</option>
                            <option value="Roti, Cereal & Selai">Roti, Cereal & Selai</option>
                            <option value="Susu & Olahan SUsu">Susu & Olahan SUsu</option>
                            <option value="Baby & Mom Produk">Baby & Mom Produk</option>
                            <option value="Sabun Pembersih">Sabun Pembersih</option>
                            <option value="Perlengkapan Dapur">Perlengkapan Dapur</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">Tipe Penjualan</label>
                        <select id="prod-type" class="w-full border rounded-lg p-2.5 bg-white focus:border-emerald-600 focus:outline-none">
                            <option value="ready">Ready Stock</option>
                            <option value="po">PO (Pre-Order)</option>
                        </select>
                    </div>
                </div>

                <!-- Input Deskripsi Produk -->
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Deskripsi Produk</label>
                    <textarea id="prod-description" rows="3" placeholder="Contoh: Sayur dipetik langsung dari petani lokal. Kondisi segar dan tanpa bahan pengawet..." class="w-full border rounded-lg p-2.5 focus:border-emerald-600 focus:outline-none"></textarea>
                </div>

                <!-- Opsi Varian Tambahan -->
                <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-200 space-y-2">
                    <p class="font-bold text-emerald-800 text-[11px] flex items-center gap-1">
                        <i class="fas fa-tags"></i> Fitur Varian (Format: Nama:Harga, Dipisahkan Koma)
                    </p>
                    <div>
                        <label class="block text-gray-600 mb-0.5">Opsi Jenis / Kondisi</label>
                        <input type="text" id="prod-variants" placeholder="Contoh: Utuh:35000, Bersih/Potong:38000" class="w-full border rounded-lg p-2 focus:border-emerald-600 focus:outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-gray-600 mb-0.5">Opsi Ukuran / Berat</label>
                        <input type="text" id="prod-sizes" placeholder="Contoh: 500 gram:20000, 1 Kg:39000" class="w-full border rounded-lg p-2 focus:border-emerald-600 focus:outline-none bg-white">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-gray-700 mb-1">URL Gambar (Opsional)</label>
                    <input type="url" id="prod-image" placeholder="https://images.unsplash.com/..." class="w-full border rounded-lg p-2.5 focus:border-emerald-600 focus:outline-none">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" id="btn-save" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition">
                        <i class="fas fa-save mr-1"></i> Simpan Produk
                    </button>
                    <button type="button" id="btn-cancel" onclick="resetForm()" class="hidden bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold px-4 py-2.5 rounded-lg transition">
                        Batal
                    </button>
                </div>
            </form>
        </section>

        <!-- Daftar Produk -->
        <section class="bg-white rounded-xl p-4 border shadow-sm space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="font-bold text-gray-800 text-sm flex items-center gap-2">
                    <i class="fas fa-boxes text-emerald-600"></i> Kelola Stok Produk
                </h2>
                <span id="product-count" class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2 py-0.5 rounded-full">0 Produk</span>
            </div>

            <!-- Fitur Pencarian Produk -->
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="search-input" placeholder="Cari nama produk atau kategori..." class="w-full pl-8 pr-3 py-2 text-xs border rounded-lg focus:border-emerald-600 focus:outline-none bg-gray-50">
            </div>

            <div id="admin-product-list" class="space-y-3 text-xs">
                <p class="text-center text-gray-400 py-6">Memuat daftar produk...</p>
            </div>
        </section>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        // Konfigurasi PIN Admin bawaan (bisa Anda ubah di sini)
        const ADMIN_PIN = "301915";

        window.checkAdminPin = function() {
            const inputPin = document.getElementById('pin-input').value.trim();
            if (inputPin === ADMIN_PIN) {
                document.getElementById('admin-lock-screen').classList.add('hidden');
                sessionStorage.setItem('admin_auth', 'true');
            } else {
                document.getElementById('pin-error').classList.remove('hidden');
            }
        };

        // Otomatis buka jika sudah login dalam satu sesi peramban
        if (sessionStorage.getItem('admin_auth') === 'true') {
            document.getElementById('admin-lock-screen').classList.add('hidden');
        }

        const firebaseConfig = {
            apiKey: "AIzaSyCkZoh9h3ckqqpsrBxRNEZsQFZWkzAX42o",
            authDomain: "tokosayur-44c5e.firebaseapp.com",
            projectId: "tokosayur-44c5e",
            storageBucket: "tokosayur-44c5e.firebasestorage.app",
            messagingSenderId: "272668584834",
            appId: "1:272668584834:web:258a983b01bfbe08f87d9b",
            measurementId: "G-XDC529DV1Y"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const productsCol = collection(db, "products");

        let productsData = [];

        async function loadAdminProducts() {
            try {
                const snapshot = await getDocs(productsCol);
                productsData = [];
                snapshot.forEach(d => productsData.push({ id: d.id, ...d.data() }));

                filterAndRender();
            } catch (err) {
                console.error(err);
                document.getElementById('admin-product-list').innerHTML = `<p class="text-center text-red-500 py-4">Gagal memuat produk.</p>`;
            }
        }

        // Fungsi Filter Berdasarkan Input Pencarian
        function filterAndRender() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = productsData.filter(p => {
                const nameMatch = p.name ? p.name.toLowerCase().includes(query) : false;
                const catMatch = p.category ? p.category.toLowerCase().includes(query) : false;
                return nameMatch || catMatch;
            });

            document.getElementById('product-count').innerText = `${filtered.length} dari ${productsData.length} Produk`;
            renderAdminList(filtered);
        }

        document.getElementById('search-input').addEventListener('input', filterAndRender);

        function renderAdminList(items) {
            const container = document.getElementById('admin-product-list');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-6">Produk tidak ditemukan.</p>`;
                return;
            }

            const fallbackImg = "https://placehold.co/300x300/10b981/ffffff?text=SayurBest";

            items.forEach(p => {
                const img = (p.imageUrl && p.imageUrl.trim() !== '') ? p.imageUrl : fallbackImg;
                const badge = p.type === 'po' ? '<span class="text-[9px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-semibold">PO</span>' : '<span class="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-semibold">Ready</span>';
                const descText = p.description ? p.description : '';

                const html = `
                    <div class="flex items-start justify-between p-2.5 bg-gray-50 rounded-xl border gap-2">
                        <!-- Ditambahkan loading="lazy" -->
                        <img src="${img}" loading="lazy" onerror="this.onerror=null;this.src='${fallbackImg}';" class="w-12 h-12 object-cover rounded-lg border mt-0.5">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5">
                                <h4 class="font-bold text-gray-800 truncate">${p.name}</h4>
                                ${badge}
                            </div>
                            <p class="text-[11px] text-emerald-600 font-semibold">Rp ${Number(p.price).toLocaleString('id-ID')} <span class="text-gray-400 font-normal">/ ${p.unit || ''}</span></p>
                            <p class="text-[10px] text-gray-500 font-medium">${p.category}</p>
                            ${descText ? `<p class="text-[10px] text-gray-400 line-clamp-1 italic mt-0.5">${descText}</p>` : ''}
                        </div>
                        <div class="flex gap-1">
                            <button onclick="setupEdit('${p.id}')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 p-2 rounded-lg transition" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteProduct('${p.id}', '${p.name}')" class="bg-red-100 hover:bg-red-200 text-red-700 p-2 rounded-lg transition" title="Hapus">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function parseInputToArray(str) {
            if (!str) return [];
            return str.split(',')
                      .map(s => s.trim())
                      .filter(s => s.length > 0);
        }

        function formatArrayToString(arr) {
            if (!arr || !Array.isArray(arr)) return '';
            return arr.map(item => {
                if (typeof item === 'object' && item !== null) {
                    return item.name ? `${item.name}${item.price !== null && item.price !== undefined ? ':' + item.price : ''}` : JSON.stringify(item);
                }
                return String(item);
            }).join(', ');
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            
            const variantStr = document.getElementById('prod-variants').value;
            const sizeStr = document.getElementById('prod-sizes').value;

            const payload = {
                name: document.getElementById('prod-name').value.trim(),
                price: Number(document.getElementById('prod-price').value),
                unit: document.getElementById('prod-unit').value.trim(),
                category: document.getElementById('prod-category').value,
                type: document.getElementById('prod-type').value,
                description: document.getElementById('prod-description').value.trim(),
                imageUrl: document.getElementById('prod-image').value.trim(),
                variants: parseInputToArray(variantStr),
                sizes: parseInputToArray(sizeStr)
            };

            const btnSave = document.getElementById('btn-save');
            btnSave.disabled = true;
            btnSave.innerText = "Saving...";

            try {
                if (id) {
                    await updateDoc(doc(db, "products", id), payload);
                } else {
                    await addDoc(productsCol, payload);
                }
                resetForm();
                await loadAdminProducts();
            } catch (err) {
                alert("Gagal menyimpan data: " + err.message);
            } finally {
                btnSave.disabled = false;
                btnSave.innerText = "Simpan Produk";
            }
        });

        window.setupEdit = function(id) {
            const p = productsData.find(item => item.id === id);
            if (!p) return;

            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-name').value = p.name;
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-unit').value = p.unit || '';
            document.getElementById('prod-category').value = p.category || 'Sayuran';
            document.getElementById('prod-type').value = p.type || 'ready';
            document.getElementById('prod-description').value = p.description || '';
            document.getElementById('prod-image').value = p.imageUrl || '';
            document.getElementById('prod-variants').value = formatArrayToString(p.variants);
            document.getElementById('prod-sizes').value = formatArrayToString(p.sizes);

            document.getElementById('form-title').innerHTML = `<i class="fas fa-edit text-amber-500"></i> Edit Produk: ${p.name}`;
            document.getElementById('btn-cancel').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteProduct = async function(id, name) {
            if (confirm(`Apakah kamu yakin ingin menghapus "${name}"?`)) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    await loadAdminProducts();
                } catch (err) {
                    alert("Gagal menghapus: " + err.message);
                }
            }
        };

        window.resetForm = function() {
            document.getElementById('product-form').reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('form-title').innerHTML = `<i class="fas fa-plus-circle text-emerald-600"></i> Tambah Produk Baru`;
            document.getElementById('btn-cancel').classList.add('hidden');
        };

        loadAdminProducts();
    </script>
</body>
</html>
